version: 2
updates:

  # ── npm packages in ci/ (tsx, future CI scripts) ────────────────────────────
  # Lives outside .github/ because Dependabot PRs may not modify that protected
  # directory from non-actions ecosystems (dependabot-core#15237).
  - package-ecosystem: npm
    directory: /ci
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
    open-pull-requests-limit: 5

  # ── Maven (Spring Boot parent + library dependencies, all modules) ──────────
  # Scans the root pom; the reactor's child modules are picked up from there.
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
    open-pull-requests-limit: 5

  # ── GitHub Actions (checkout, setup-java, setup-node, paths-filter, etc.) ───
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
    open-pull-requests-limit: 5
