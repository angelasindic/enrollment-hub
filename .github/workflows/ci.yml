name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Explicitly grant the permissions required by the action
permissions:
  contents: read
  pull-requests: read
  checks: write        # post test annotations

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  build-test:
    needs: changes
    if: needs.changes.outputs.list != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: ./.github/actions/setup-java-maven

      - name: Build, unit and integration tests
        run: |
          ./mvnw -pl "${{ needs.changes.outputs.list }}" -am verify --batch-mode --no-transfer-progress

      - uses: ./.github/actions/publish-test-reports

  static-analysis:
    needs: changes
    if: needs.changes.outputs.list != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: ./.github/actions/setup-java-maven

      # The quality profile binds Checkstyle to validate and PMD to process-test-classes: PMD gets the
      # compiled classes for type resolution, and -am puts sibling modules in the reactor.
      - name: Checkstyle and PMD
        run: |
          ./mvnw -pl "${{ needs.changes.outputs.list }}" -am process-test-classes -Pquality --batch-mode --no-transfer-progress --fail-at-end

  # Single required check for branch protection. Path filters skip jobs, and a skipped required
  # check blocks the merge; this job passes when every upstream job succeeded or was skipped.
  ci-ok:
    if: always()
    needs: [ changes, build-test, static-analysis ]
    runs-on: ubuntu-latest
    permissions: { }
    steps:
      - name: Fail if an upstream job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
