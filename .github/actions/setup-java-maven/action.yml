name: Setup Java and Maven
description: Temurin JDK with Maven dependency cache. The repository must already be checked out.

inputs:
  java-version:
    description: JDK major version
    default: '25'

runs:
  using: composite
  steps:
    - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v5
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}
        cache: maven
