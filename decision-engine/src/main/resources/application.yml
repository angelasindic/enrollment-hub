spring:
  application:
    name: decision-engine
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/enrollmenthub
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    default-schema: enrollment_hub
    schemas: enrollment_hub
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: enrollment_hub
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # jwk-set-uri (not issuer-uri) avoids issuer discovery at startup, so the service boots
          # offline and the Testcontainers ITs keep working without the IdP running.
          jwk-set-uri: ${IDP_JWKS_URI:http://localhost:9000/oauth2/jwks}

# Prerequisite token validation — public keys per issuer
# prerequisite.tokens.credit-card.jwks-uri=...
# prerequisite.tokens.eidas.jwks-uri=...

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

decision-engine:
  scatter-gather:
    timeout: 1m
  timeout-poller:
    # Fixed delay between poll passes (ADR-15). Also consumed by the @Scheduled annotation
    # on TimeoutPoller via this property key.
    interval: ${DECISION_ENGINE_TIMEOUT_POLLER_INTERVAL:10s}
    # Rows claimed per poll transaction; small batches bound row-lock duration.
    batch-size: ${DECISION_ENGINE_TIMEOUT_POLLER_BATCH_SIZE:100}
  amqp:
    confirm-timeout: ${DECISION_ENGINE_AMQP_CONFIRM_TIMEOUT:5s}
