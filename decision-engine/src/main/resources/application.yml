spring:
  application:
    name: decision-engine
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/enrollmenthub
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    default-schema: enrollment_hub
    schemas: enrollment_hub
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: enrollment_hub
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # jwk-set-uri (not issuer-uri) avoids issuer discovery at startup, so the service boots
          # offline and the Testcontainers ITs keep working without the IdP running.
          jwk-set-uri: ${IDP_JWKS_URI:http://localhost:9000/oauth2/jwks}

# Prerequisite-token validation (ADR-03). The credit_card_check token is a trust root distinct from
# the bearer token, validated against the payment-check issuer's JWKS. eIDAS (INVOICE route) is deferred.
prerequisite:
  tokens:
    credit-card:
      issuer: ${PAYMENT_CHECK_ISSUER_URI:http://localhost:9000/payment-check}
      jwks-uri: ${PAYMENT_CHECK_JWKS_URI:http://localhost:9000/payment-check/jwks}
      audience: ${ENROLLMENT_API_AUDIENCE:enrollment-api}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  # Spring Boot 4.0 OTLP export lives under management.opentelemetry.<signal>.export.otlp.*
  # (the old management.otlp.tracing/logging.* keys are deprecated at error level and ignored).
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
  # Metrics use the Micrometer OTLP registry (separate path; requires micrometer-registry-otlp).
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
logging:
  pattern:
    level: "%5p[${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

decision-engine:
  scatter-gather:
    timeout: 1m
  timeout-poller:
    # Fixed delay between poll passes (ADR-15). Also consumed by the @Scheduled annotation
    # on TimeoutPoller via this property key.
    interval: ${DECISION_ENGINE_TIMEOUT_POLLER_INTERVAL:10s}
    # Rows claimed per poll transaction; small batches bound row-lock duration.
    batch-size: ${DECISION_ENGINE_TIMEOUT_POLLER_BATCH_SIZE:100}
  amqp:
    confirm-timeout: ${DECISION_ENGINE_AMQP_CONFIRM_TIMEOUT:5s}
