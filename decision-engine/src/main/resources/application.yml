spring:
  application:
    name: decision-engine
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/enrollmenthub
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    default-schema: enrollment_hub
    schemas: enrollment_hub
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: enrollment_hub
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # jwk-set-uri keeps key resolution off the discovery endpoint, so the service boots
          # offline and the Testcontainers ITs keep working without the IdP running. With
          # jwk-set-uri present, issuer-uri triggers no startup discovery either — it only adds
          # the iss validator. audiences adds the aud validator (the authorization-server stamps
          # aud: enrollment-api on enrollment:write access tokens), so a token signed by the IdP
          # for another resource is rejected here.
          jwk-set-uri: ${IDP_JWKS_URI:http://localhost:9000/oauth2/jwks}
          issuer-uri: ${IDP_ISSUER_URI:http://localhost:9000}
          audiences: ${ENROLLMENT_API_AUDIENCE:enrollment-api}

# Prerequisite-token validation (ADR-03). The credit_card_check token is a trust root distinct from
# the bearer token, validated against the payment-check issuer's JWKS. eIDAS (INVOICE route) is deferred.
prerequisite:
  tokens:
    credit-card:
      issuer: ${PAYMENT_CHECK_ISSUER_URI:http://localhost:9000/payment-check}
      jwks-uri: ${PAYMENT_CHECK_JWKS_URI:http://localhost:9000/payment-check/jwks}
      audience: ${ENROLLMENT_API_AUDIENCE:enrollment-api}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  # Spring Boot 4.0 OTLP export lives under management.opentelemetry.<signal>.export.otlp.*
  # (the old management.otlp.tracing/logging.* keys are deprecated at error level and ignored).
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
  # Metrics use the Micrometer OTLP registry (separate path; requires micrometer-registry-otlp).
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
logging:
  pattern:
    level: "%5p[${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

decision-engine:
  scatter-gather:
    timeout: 1m
  sweep:
    # Single background sweep (EnrollmentSweepJob). Two phases per tick: finalize expired-and-undecided
    # rows (ADR-15 timeout policy), then dispatch decided-but-undispatched rows (ADR-17 outbox backstop).
    # One cadence drives both: timeout detection wants promptness, and the dispatch phase is a loose
    # backstop because the after-commit eager dispatch owns steady-state delivery latency — so the
    # tighter timeout cadence satisfies both.
    interval: ${DECISION_ENGINE_SWEEP_INTERVAL:10s}
    # Rows claimed per phase transaction; small batches bound row-lock duration and the duplicate
    # blast radius of a mid-batch publish failure in the dispatch phase.
    batch-size: ${DECISION_ENGINE_SWEEP_BATCH_SIZE:100}
  retention:
    # Storage limitation on original_request (ADR-20). Its own schedule rather than a third phase
    # of the sweep: the sweep merges its phases because both sit in the same latency class, and
    # retention — measured in hours — does not.
    # No waiting period after the confirm: nothing here reads the payload once dispatched_at is
    # stamped, and recovering a delivered EnrollmentDecisionEvent — the only message the payload is
    # read to build — belongs to the Account Service, which owns that queue (ADR-13 §Channel
    # Ownership). Set enabled=false to stop the job; there is no window to widen instead.
    enabled: ${DECISION_ENGINE_RETENTION_ENABLED:true}
    interval: ${DECISION_ENGINE_RETENTION_INTERVAL:15m}
    batch-size: ${DECISION_ENGINE_RETENTION_BATCH_SIZE:500}
  amqp:
    confirm-timeout: ${DECISION_ENGINE_AMQP_CONFIRM_TIMEOUT:5s}
