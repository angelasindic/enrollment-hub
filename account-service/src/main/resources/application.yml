server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: account-service
  threads:
    virtual:
      enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        prefetch: ${RABBITMQ_LISTENER_PREFETCH:16}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  tracing:
    enabled: true
    sampling:
      probability: 1.0          # 1.0 = sample everything; lower in prod
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
  logging:
    pattern:
      level: "%5p[${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

account-service:
  dedup-capacity: ${ACCOUNT_SERVICE_DEDUP_CAPACITY:10000}
