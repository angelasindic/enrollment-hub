services:

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: enrollmenthub
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d enrollmenthub" ]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
