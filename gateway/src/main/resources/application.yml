spring:
  application:
    name: gateway
  threads:
    virtual:
      enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  security:
    oauth2:
      client:
        # Endpoints are listed explicitly (not via issuer-uri) so the gateway boots even when the
        # authorization-server is momentarily down, and context-load tests run without it.
        provider:
          spring-authorization-server:
            authorization-uri: ${IDP_ISSUER_URI:http://localhost:9000}/oauth2/authorize
            token-uri: ${IDP_ISSUER_URI:http://localhost:9000}/oauth2/token
            jwk-set-uri: ${IDP_ISSUER_URI:http://localhost:9000}/oauth2/jwks
            user-info-uri: ${IDP_ISSUER_URI:http://localhost:9000}/userinfo
            user-name-attribute: sub
        registration:
          enrollment-gateway:
            provider: spring-authorization-server
            client-id: enrollment-gateway
            client-secret: ${GATEWAY_CLIENT_SECRET:enrollment-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "http://127.0.0.1:8079/login/oauth2/code/enrollment-gateway"
            scope:
              - openid
              - profile
              - enrollment:write
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: enrollment
              uri: http://${DECISION_ENGINE_HOST:localhost}:8080
              predicates:
                - Path=/enrollment/**
              filters:
                # Forward the logged-in user's access token downstream to the decision-engine.
                - TokenRelay=

server:
  port: 8079
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
