spring:
  application:
    name: gateway
  threads:
    virtual:
      enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  security:
    oauth2:
      client:
        # Endpoints are listed explicitly (not via issuer-uri) so the gateway boots even when the
        # authorization-server is momentarily down, and context-load tests run without it.
        provider:
          spring-authorization-server:
            authorization-uri: ${IDP_ISSUER_URI:http://localhost:9000}/oauth2/authorize
            token-uri: ${IDP_ISSUER_URI:http://localhost:9000}/oauth2/token
            jwk-set-uri: ${IDP_ISSUER_URI:http://localhost:9000}/oauth2/jwks
            user-info-uri: ${IDP_ISSUER_URI:http://localhost:9000}/userinfo
            user-name-attribute: sub
        registration:
          enrollment-gateway:
            provider: spring-authorization-server
            client-id: enrollment-gateway
            client-secret: ${GATEWAY_CLIENT_SECRET:enrollment-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "http://127.0.0.1:8079/login/oauth2/code/enrollment-gateway"
            scope:
              - openid
              - profile
              - enrollment:write
          # client_credentials registration for the server-to-server payment-check call (Step 3):
          # same client, distinct grant + scope. No redirect-uri (not a user/login flow).
          payment-check:
            provider: spring-authorization-server
            client-id: enrollment-gateway
            client-secret: ${GATEWAY_CLIENT_SECRET:enrollment-secret}
            authorization-grant-type: client_credentials
            scope:
              - prerequisite:issue
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: enrollment
              uri: http://${DECISION_ENGINE_HOST:localhost}:8080
              predicates:
                - Path=/enrollment/**
              filters:
                # Forward the logged-in user's access token downstream to the decision-engine.
                - TokenRelay=

server:
  port: 8079
  forward-headers-strategy: framework

# Simulated payment-check issuer (co-located in the authorization-server). The gateway calls
# POST {issuer-uri}/credit-card server-to-server with the client_credentials token (Step 3 / ADR-03).
payment-check:
  issuer-uri: ${PAYMENT_CHECK_ISSUER_URI:http://localhost:9000/payment-check}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  tracing:
    enabled: true
    sampling:
      probability: 1.0          # 1.0 = sample everything; lower in prod
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
  logging:
    pattern:
      level: "%5p[${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

