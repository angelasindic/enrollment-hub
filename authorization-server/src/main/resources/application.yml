server:
  port: 9000

spring:
  application:
    name: authorization-server
  threads:
    virtual:
      enabled: true
  datasource:
    # currentSchema pins the search_path so the unqualified SQL emitted by the SAS Jdbc
    # services and JdbcUserDetailsManager resolves to this service's own schema.
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/enrollmenthub?currentSchema=authorization_server
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    default-schema: authorization_server
    schemas: authorization_server

# Simulated payment-check prerequisite issuer (ADR-03) — a trust root fully separate from the OIDC
# issuer (its own iss/kid/JWKS), co-located here. Stands in for an external provider (e.g. Adyen).
payment-check:
  issuer: ${PAYMENT_CHECK_ISSUER_URI:http://localhost:9000/payment-check}
  audience: ${ENROLLMENT_API_AUDIENCE:enrollment-api}
  token-ttl: 10m

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
