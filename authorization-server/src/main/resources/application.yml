server:
  port: 9000

spring:
  application:
    name: authorization-server
  threads:
    virtual:
      enabled: true
  datasource:
    # currentSchema pins the search_path so the unqualified SQL emitted by the SAS Jdbc
    # services and JdbcUserDetailsManager resolves to this service's own schema.
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/enrollmenthub?currentSchema=authorization_server
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    default-schema: authorization_server
    schemas: authorization_server

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
