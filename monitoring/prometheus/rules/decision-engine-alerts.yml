groups:
  - name: decision-engine
    rules:
      # Publisher-confirm failures on any decision-engine publish (intake, check
      # commands, decision events). reason=nack — the broker refused the publish;
      # reason=returned — unroutable (mandatory publishing; check bindings).
      # The affected work is not lost: intake/check publishes are retried via broker
      # redelivery, decision events via the dispatch backstop (ADR-17). Sustained
      # firing means broker instability or a missing binding.
      - alert: DecisionPublishFailures
        expr: increase(decisionengine_publish_failures_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Decision-engine publish failures (reason: {{ $labels.reason }})"
          description: >
            {{ $value }} publisher-confirm failure(s) with reason={{ $labels.reason }}
            in the last 15 minutes. nack = broker refused; returned = unroutable
            (verify the consumer binding exists). Retries are automatic; investigate
            the broker and bindings if sustained.

      # The ADR-17 stuck-outbox alert: a decided enrollment has been awaiting
      # dispatch for more than 5 minutes, meaning BOTH the eager after-commit
      # dispatch and the scheduled sweep backstop are failing to publish.
      # Rows in the outbox state are never lost (decision_result NOT NULL,
      # dispatched_at NULL), but downstream consumers are not receiving decisions.
      - alert: StuckDecisionOutbox
        expr: decisionengine_outbox_oldest_age_seconds > 300
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Decided enrollment(s) undispatched for more than 5 minutes"
          description: >
            The oldest decided-but-undispatched correlation row is {{ $value }}s old.
            Check broker health and decision-engine logs; the sweep re-publishes
            automatically once the broker accepts publishes again (ADR-17).

      # ADR-15 fail-open visibility. A signal that never answered (NOT_EXECUTED)
      # or ran without producing a value (NO_RESULT) contributes nothing to the
      # aggregation — enrollments are still decided and dispatched, on less
      # evidence, with no other symptom. This is the only alert that fires while
      # the pipeline looks healthy.
      #
      # Expressed as a proportion of settlements per signal, not a raw count: at
      # 5 RPS and at 500 the same absolute number means different things. The
      # `>= 10` denominator guard keeps a handful of settlements on a quiet
      # instance from tripping a ratio.
      - alert: SignalFailingOpen
        expr: >
          (
            sum by (signal) (increase(decisionengine_signal_settled_total{state=~"NO_RESULT|NOT_EXECUTED"}[30m]))
            /
            sum by (signal) (increase(decisionengine_signal_settled_total[30m]))
          ) > 0.2
          and
          sum by (signal) (increase(decisionengine_signal_settled_total[30m])) >= 10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.signal }} is failing open on {{ $value | humanizePercentage }} of decisions"
          description: >
            More than 20% of {{ $labels.signal }} settlements in the last 30 minutes
            produced no usable result, so decisions are being taken without that
            signal (ADR-15 fail-open). Enrollments are unaffected and nothing is
            lost — check the signal's worker, its dependencies, and the DLQ.
            Split NOT_EXECUTED (no reply before the deadline — worker or broker)
            from NO_RESULT (worker answered, could not produce a value — its own
            dependency) by the `state` label.

      # ADR-20 storage limitation. The gauge is the age of the oldest correlation
      # row still holding an enrollment payload, so it answers the compliance
      # question directly — how long has this service held personal data — rather
      # than by inference from the retention job's counters.
      #
      # Healthy is bounded by how long a row legitimately holds a payload: until it
      # is decided (scatter-gather timeout, 1m) and delivered, then until the next
      # retention pass (15m). One hour leaves margin for a long batch drain. The
      # gauge reads the same whether
      # the cause is a stalled retention job, a decision stuck in the outbox, or a
      # row the timeout poller never finalized; all three are the service holding
      # PII longer than §8.2 says it does. StuckDecisionOutbox catches the second
      # case sooner and more specifically, so this firing alone points at retention.
      #
      # NaN means the probe failed, not that nothing is held (RetentionMetricsConfig),
      # and NaN does not satisfy the comparison — a database outage silences this
      # alert rather than clearing it. DecisionPublishFailures and the datasource's
      # own up metric are what surface that.
      - alert: EnrollmentPayloadHeldTooLong
        expr: decisionengine_payload_oldest_age_seconds > 3600
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Enrollment payload held beyond the retention window"
          description: >
            The oldest correlation row still holding an enrollment payload is
            {{ $value }}s old, well past a normal delivery. Check that the retention
            job is running and enabled (decision-engine.retention.enabled), and that
            decisionengine_payload_stripped_total is advancing. See ADR-20.
